const sleep = ms => new Promise(r => setTimeout(r, ms));
const CACHE_KEY = 'iwfCache';
let lastSync = 0;
let inflight = null;
const pendingSaves = new Set();
let deferredPrompt = null;
let firstRevealDone = false;
let splashHidden = false;
const splashStart = Date.now();

function fetchWithTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms || 15000);
  return fetch(url, Object.assign({}, opts || {}, { signal: ctrl.signal })).finally(() => clearTimeout(id));
}

const validData = j => !!(j && Array.isArray(j.weeks) && Array.isArray(j.singeing) && Array.isArray(j.lifetime) && j.assumptions);

function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && c.url === scriptUrl && validData(c.data)) return c;
  } catch (e) {}
  return null;
}

function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ url: scriptUrl, t: lastSync, data })); } catch (e) {}
}

function applyData(json) {
  data = json;
  lastSync = Date.now();
  saveCache();
  setSyncStatus('ok');
  renderAll();
  updateOnlineBar();
  hideSplashSoon();
}

function fetchFromSheet() {
  if (!scriptUrl) { setSyncStatus('no-url'); return Promise.resolve(false); }
  if (inflight) return inflight;
  if (!navigator.onLine) {
    setSyncStatus('error');
    if (!data) renderAll();
    updateOnlineBar();
    hideSplashSoon();
    return Promise.resolve(false);
  }
  setSyncStatus('syncing');
  inflight = (async () => {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const r = await fetchWithTimeout(scriptUrl, { cache: 'no-store' }, 15000);
        const json = await r.json();
        if (!validData(json)) throw new Error('bad data');
        applyData(json);
        return true;
      } catch (e) {
        if (attempt === 0) await sleep(500);
      }
    }
    setSyncStatus('error');
    if (!data) renderAll();
    updateOnlineBar();
    hideSplashSoon();
    return false;
  })().finally(() => { inflight = null; });
  return inflight;
}

// opts: { key, clearIds, apply }  — apply() updates local data instantly (optimistic); it is rolled back if saving fails
async function pushAction(action, opts) {
  const o = opts || {};
  const key = o.key || 'save';
  const clearIds = o.clearIds || [];
  if (pendingSaves.has(key)) return false;
  if (!scriptUrl) { showToast(t('toastNoUrl'), 'err'); haptic([40, 60, 40]); return false; }
  if (!navigator.onLine) { showToast(t('toastOffline'), 'err'); haptic([40, 60, 40]); return false; }

  const backup = data ? JSON.stringify(data) : null;
  const lockIds = o.lockIds || [];
  const typed = clearIds.concat(lockIds).map(id => { const el = document.getElementById(id); return [id, el ? el.value : '']; });
  lockIds.forEach(id => unlockedFields.delete(id));
  pendingSaves.add(key);
  applyPending();
  setSyncStatus('syncing');

  if (o.apply && data) {
    o.apply();
    clearIds.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    renderAll();
  }

  try {
    const res = await fetchWithTimeout(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(action),
    }, 20000);
    let json = null;
    try { json = await res.json(); } catch (e) {}
    if (validData(json)) applyData(json); else await fetchFromSheet();
    showToast(t('toastSaved'), 'ok');
    haptic(30);
    return true;
  } catch (e) {
    if (backup) data = JSON.parse(backup);
    lockIds.forEach(id => unlockedFields.add(id));
    setSyncStatus('error');
    renderAll();
    typed.forEach(([id, v]) => { const el = document.getElementById(id); if (el && v !== '') el.value = v; });
    showToast(t('toastFailed'), 'err');
    haptic([40, 60, 40]);
    return false;
  } finally {
    pendingSaves.delete(key);
    applyPending();
  }
}

function applyPending() {
  document.querySelectorAll('[data-save]').forEach(el => el.classList.toggle('btn-loading', pendingSaves.has(el.dataset.save)));
}

let toastTimer;

// ---- count-up numbers ----
const cuMemory = {};
function cu(key, v) {
  const n = Number(v) || 0;
  return `<span class="cu" data-k="${key}" data-v="${n}">${fmtBDT(n)}</span>`;
}
function runCountUps() {
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.cu').forEach(el => {
    const key = el.dataset.k;
    const target = Number(el.dataset.v) || 0;
    const from = cuMemory[key] === undefined ? 0 : cuMemory[key];
    cuMemory[key] = target;
    if (reduce || from === target) return;
    const start = performance.now();
    const dur = 700;
    el.textContent = fmtBDT(from);
    const step = now => {
      const k = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtBDT(from + (target - from) * e);
      if (k < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = fmtBDT(target);
    };
    requestAnimationFrame(step);
  });
}

// ---- staggered card reveal ----
function staggerIn(panel) {
  if (!panel) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const list = Array.from(panel.querySelectorAll('.space-y-3 > *, .space-y-4 > *, .space-y-6 > *'));
  Array.from(panel.children).forEach(c => { if (c.classList.contains('glass-card') && !list.includes(c)) list.unshift(c); });
  list.forEach((el, i) => {
    el.style.setProperty('--i', Math.min(i, 8));
    el.classList.remove('reveal');
    void el.offsetWidth;
    el.classList.add('reveal');
  });
}

// ---- week-over-week chip + charts ----
function deltaChip(cur, prev) {
  if (prev === undefined || prev === null || prev === '') return '';
  const d = (Number(cur) || 0) - (Number(prev) || 0);
  if (Math.abs(d) < 1) return '';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${fmtBDT(Math.abs(d))}</span>`;
}

function chartHead(title, sub) {
  return `<div class="px-6 py-4 border-b border-slate-200/60 bg-white/40">

    ${sub ? `<p class="text-[11px] text-slate-500 font-semibold mt-0.5">${sub}</p>` : ''}
  </div>`;
}

function weeksChartHTML() {
  const rows = (data.weeks || []).slice(0, 4);
  const vals = rows.map(w => Number(w.combinedProfit) || 0);
  if (!rows.length || !vals.some(v => v !== 0)) return '';
  const W = 320, H = 172, top = 28, bottom = 30, pad = 14;
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0), span = (max - min) || 1;
  const y = v => top + ((max - v) / span) * (H - top - bottom);
  const y0 = y(0);
  const slot = (W - pad * 2) / rows.length;
  const bw = Math.min(48, slot * 0.58);
  let bars = '';
  vals.forEach((v, i) => {
    const x = pad + slot * i + (slot - bw) / 2;
    const yy = Math.min(y(v), y0);
    const hh = Math.max(Math.abs(y(v) - y0), 2);
    const pos = v >= 0;
    const labelY = pos ? yy - 7 : yy + hh + 14;
    const cx = (x + bw / 2).toFixed(1);
    bars += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="8" fill="url(#${pos ? 'cgPos' : 'cgNeg'})"></rect>`
      + `<text x="${cx}" y="${labelY.toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="${pos ? '#047857' : '#b91c1c'}">${fmtBDT(v)}</text>`
      + `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">${localDigits(lang === 'bn' ? 'সপ্তাহ ' + (i + 1) : 'Wk ' + (i + 1))}</text>`;
  });
  const deltas = vals.map((v, i) => (i === 0 ? '<span></span>' : (deltaChip(v, vals[i - 1]) || '<span></span>'))).join('');
  return `<div class="glass-card overflow-hidden">
    ${chartHead(t('chartWeeklyTitle'), t('chartWeeklySub'))}
    <div style="padding-top:12px">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chartWeeklyTitle')}">
        <defs>
          <linearGradient id="cgPos" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
          <linearGradient id="cgNeg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
        </defs>
        <line x1="${pad}" x2="${W - pad}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="#cbd5e1" stroke-dasharray="3 4"></line>
        ${bars}
      </svg>
      <div class="chart-deltas">${deltas}</div>
    </div>
  </div>`;
}

function lifetimeChartHTML(curYear) {
  const MS = lang === 'bn'
    ? ['জানু', 'ফেব', 'মার্চ', 'এপ্রি', 'মে', 'জুন', 'জুলা', 'আগ', 'সেপ্টে', 'অক্টো', 'নভে', 'ডিসে']
    : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const nowMonth = new Date().getMonth();
  const pts = [];
  data.lifetime.forEach(r => {
    if (Number(r.year) !== curYear || r.profitLossYear === '' || r.profitLossYear === null || r.profitLossYear === undefined) return;
    const mi = MONTH_NAMES.indexOf(r.month);
    if (mi < 0 || mi > nowMonth) return;
    pts.push({ mi, v: Number(r.profitLossYear) || 0 });
  });
  const head = chartHead(t('chartYearTitle', localDigits(curYear)), '');
  if (pts.length < 2) return `<div class="glass-card overflow-hidden">${head}<div class="chart-note">${t('chartNeedMore')}</div></div>`;

  const W = 320, H = 176, padX = 16, top = 30, bottom = 26;
  const vals = pts.map(p => p.v);
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0), span = (max - min) || 1;
  const x = mi => padX + (mi / 11) * (W - padX * 2);
  const y = v => top + ((max - v) / span) * (H - top - bottom);
  const y0 = y(0);
  const last = pts[pts.length - 1];
  const color = last.v >= 0 ? '#10b981' : '#ef4444';
  const line = pts.map((p, i) => (i ? 'L' : 'M') + x(p.mi).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = line + ` L${x(last.mi).toFixed(1)} ${y0.toFixed(1)} L${x(pts[0].mi).toFixed(1)} ${y0.toFixed(1)} Z`;
  const dots = pts.map(p => `<circle cx="${x(p.mi).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.2" fill="#fff" stroke="${color}" stroke-width="2"></circle>`).join('');
  const labels = MS.map((m, i) => `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${pts.some(p => p.mi === i) ? '#475569' : '#cbd5e1'}">${m}</text>`).join('');
  const lx = Math.min(Math.max(x(last.mi), 36), W - 36);
  const ly = last.v >= 0 ? y(last.v) - 9 : y(last.v) + 17;
  return `<div class="glass-card overflow-hidden">
    ${head}
    <div style="padding-top:12px;padding-bottom:6px">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chartYearTitle', curYear)}">
        <defs><linearGradient id="clArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.35"/><stop offset="1" stop-color="${color}" stop-opacity="0.02"/></linearGradient></defs>
        <line x1="${padX}" x2="${W - padX}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="#cbd5e1" stroke-dasharray="3 4"></line>
        <path d="${area}" fill="url(#clArea)"></path>
        <path d="${line}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
        ${dots}
        <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="${last.v >= 0 ? '#047857' : '#b91c1c'}">${fmtBDT(last.v)}</text>
        ${labels}
      </svg>
    </div>
  </div>`;
}

const unlockedFields = new Set();
const PEN_SVG = '<svg class="ico-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const CLOSE_SVG = '<svg class="ico-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';

// An amount box: empty and editable until a value is saved; after that it is locked until the pen is tapped
function lockBox(id, saved, cls, placeholder, extra) {
  const has = saved !== '' && saved !== null && saved !== undefined && Number(saved) !== 0 && !isNaN(Number(saved));
  const editing = has && unlockedFields.has(id);
  const locked = has && !editing;
  return `<div class="lock-wrap${extra ? ' ' + extra : ''}${editing ? ' is-editing' : ''}">
    <input class="${cls}${locked ? ' is-locked' : ''}" id="${id}" type="number" inputmode="numeric" value="${has ? saved : ''}"${locked ? ' readonly' : ''} />
    ${has ? `<button type="button" class="pen-btn" onclick="togglePen('${id}')" aria-label="${t('editLabel')}">${PEN_SVG}${CLOSE_SVG}</button>` : ''}
  </div>`;
}

function togglePen(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const wrap = el.closest('.lock-wrap');
  if (unlockedFields.has(id)) {            // second tap (X) = cancel, go back to the saved value
    unlockedFields.delete(id);
    el.value = el.defaultValue;
    el.readOnly = true;
    el.classList.add('is-locked');
    wrap.classList.remove('is-editing');
  } else {
    unlockedFields.add(id);
    el.readOnly = false;
    el.classList.remove('is-locked');
    wrap.classList.add('is-editing');
    el.focus();
    try { el.select(); } catch (e) {}
  }
}

}

function renderAll() {
  const typed = [];
  document.querySelectorAll('.panel input[id]').forEach(el => {
    if (el.id !== 'settings-url' && el.value !== el.defaultValue) typed.push([el.id, el.value]);
  });
  const ae = document.activeElement;
  const activeId = ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) ? ae.id : '';
  renderAllRaw();
  typed.forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.value = v; });
  if (activeId && activeId !== 'settings-url') { const a = document.getElementById(activeId); if (a) a.focus(); }
  applyPending();
  runCountUps();
  if (data && !firstRevealDone) {

  }
}

const MONTH_NAMES_BN = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];

function getCurrentMonthName() {
  const idx = new Date().getMonth();
  return lang === 'bn' ? MONTH_NAMES_BN[idx] : MONTH_NAMES[idx];
}

// ---- 4-week cycle label (derived from the week dates in the sheet) ----
function parseSheetDate(v) {
  if (!v) return null;
  const str = String(v).trim();
  let m = str.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2}|\d{4})$/);
  if (m) {
    let y = Number(m[3]); if (y < 100) y += 2000;
    const d = Number(m[1]), mo = Number(m[2]) - 1;
    if (d < 1 || d > 31 || mo < 0 || mo > 11) return null;
    return { d, m: mo, y };
  }
  const dt = new Date(str);
  if (!isNaN(dt)) return { d: dt.getDate(), m: dt.getMonth(), y: dt.getFullYear() };
  return null;
}

// Returns [{m, y, from, to}] — one entry if all weeks fall in one month, two if the cycle spans two months.
// from/to = week-of-month numbers (1-7 = Week 1, 8-14 = Week 2, ...), same rule as the sheet header.
function getCycleInfo() {
  const rows = (data && Array.isArray(data.weeks)) ? data.weeks.slice(0, 4) : [];
  const dates = rows.map(w => parseSheetDate(w && w.date)).filter(Boolean);
  if (!dates.length) return null;
  const key = x => x.y * 12 + x.m;
  const wk = x => Math.ceil(x.d / 7);
  const k0 = key(dates[0]);
  const first = dates.filter(x => key(x) === k0);
  const rest = dates.filter(x => key(x) !== k0);
  const mk = arr => ({ m: arr[0].m, y: arr[0].y, from: wk(arr[0]), to: wk(arr[arr.length - 1]) });
  return rest.length ? [mk(first), mk(rest)] : [mk(first)];
}

function localDigits(v) {
  return lang === 'bn' ? String(v).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]) : String(v);
}

function cycleMonthLabel(g) {
  return (lang === 'bn' ? MONTH_NAMES_BN : MONTH_NAMES)[g.m] + ' ' + localDigits(g.y);
}

function cycleWeekLabel(g) {
  const w = lang === 'bn' ? 'সপ্তাহ' : 'Week';
  return localDigits(g.from === g.to ? w + ' ' + g.from : w + ' ' + g.from + '-' + g.to);
}

// Short month name(s) for labels, e.g. "September" or "August–September"
function getCycleShortName() {
  const groups = getCycleInfo();
  if (!groups) return getCurrentMonthName();
  const names = lang === 'bn' ? MONTH_NAMES_BN : MONTH_NAMES;
  return groups.map(g => names[g.m]).join('–');
}

// Month cards: one card for a single month; two cards (each with its own week range) when the cycle spans two months
function cycleHeadingHTML() {
  const groups = getCycleInfo();
  if (!groups) return `<div class="cycle-row single"><div class="cycle-chip"><span class="cycle-month">${getCurrentMonthName()}</span></div></div>`;
  const chips = groups.map(g => `<div class="cycle-chip"><span class="cycle-month">${cycleMonthLabel(g)}</span>${groups.length > 1 ? `<span class="pill-live pill-sm">${pingDot()}${cycleWeekLabel(g)}</span>` : ''}</div>`);
  return `<div class="cycle-row${groups.length === 1 ? ' single' : ''}">${chips.join('<span class="cycle-sep">–</span>')}</div>`;
}

            ${lockBox('life-cur-inc', cur.monthlyIncome, 'input-field w-full text-sm font-bold text-brand-900', '')}
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs text-slate-600 mb-5 bg-white/50 p-4 rounded-xl border border-slate-200/60 font-medium">
          <div>${t('statYearCum')} <b class="text-brand-900 block text-sm font-extrabold mt-0.5">${fmtBDT(cur.cumIncomeYear)}</b></div>
          <div>${t('statYearPL')} <b class="${Number(cur.profitLossYear) >= 0 ? 'text-finGreen-600' : 'text-finRed-600'} block text-sm font-extrabold mt-0.5">${fmtBDT(cur.profitLossYear)}</b></div>
          <div>${t('statLifetimePL')} <b class="${Number(cur.profitLossLifetime) >= 0 ? 'text-finGreen-600' : 'text-finRed-600'} block text-sm font-extrabold mt-0.5">${fmtBDT(cur.profitLossLifetime)}</b></div>

    </div>` : `<div class="glass-card p-6 text-center text-slate-600 text-sm mb-6">${t('notFoundMonth', curMonthName, curYear)}</div>`;

  const yearRows = data.lifetime.filter(r => Number(r.year) === curYear);
  const yearTableRows = yearRows.map(r => `

      <td class="py-3.5 px-2 font-bold text-brand-900 truncate">${r.month}</td>
      <td class="py-3.5 px-2 text-right text-slate-700 font-medium">${r.investment !== '' ? fmtBDT(r.investment) : '—'}</td>
      <td class="py-3.5 px-2 text-right text-slate-700 font-medium">${r.monthlyIncome !== '' ? fmtBDT(r.monthlyIncome) : '—'}</td>
      <td class="py-3.5 px-2 text-right font-bold ${r.profitLossYear !== '' && Number(r.profitLossYear) >= 0 ? 'text-finGreen-600' : (r.profitLossYear !== '' ? 'text-finRed-600' : 'text-slate-400')}">${r.profitLossYear !== '' ? fmtBDT(r.profitLossYear) : '—'}</td>
    </tr>`).join('');

  const byYear = {};
  data.lifetime.forEach(r => { if (r.profitLossLifetime !== '') byYear[r.year] = r; });
  const yearlySummaryRows = Object.keys(byYear).sort().map(y => {

      <td class="py-3.5 px-4 font-bold text-brand-900">${y}</td>
      <td class="py-3.5 px-4 text-right text-slate-700 font-medium">${fmtBDT(r.cumInvestLifetime)}</td>
      <td class="py-3.5 px-4 text-right text-slate-700 font-medium">${fmtBDT(r.cumIncomeLifetime)}</td>
      <td class="py-3.5 px-4 text-right font-bold ${Number(r.profitLossLifetime) >= 0 ? 'text-finGreen-600' : 'text-finRed-600'}">${fmtBDT(r.profitLossLifetime)}</td>

  el.innerHTML = currentCardHtml + `

                <th class="py-3 px-4 text-right bg-white/80">${t('colTotalInvest')}</th>
                <th class="py-3 px-4 text-right bg-white/80">${t('colTotalIncome')}</th>
                <th class="py-3 px-4 text-right bg-white/80">${t('colLifetimePL')}</th>
              </tr>
            </thead>
            <tbody>${yearlySummaryRows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

async function saveCurrentLifetime(i) {
  const row = data.lifetime[i];
  const invVal = document.getElementById('life-cur-inv').value.trim();
  const incVal = document.getElementById('life-cur-inc').value.trim();
  // A box left empty keeps the amount already saved in the sheet (so it never gets overwritten with 0)
  const investment = invVal !== '' ? (Number(invVal) || 0) : (Number(row.investment) || 0);
  const monthlyIncome = incVal !== '' ? (Number(incVal) || 0) : (Number(row.monthlyIncome) || 0);
  const year = row.year;
  const month = row.month;
  await pushAction({ action: 'updateLifetimeMonth', year, month, investment, monthlyIncome }, {
    key: 'life',
    lockIds: ['life-cur-inv', 'life-cur-inc'],
    apply: () => { row.investment = investment; row.monthlyIncome = monthlyIncome; },
  });
}

function renderSettings() {
  const el = document.getElementById('panel-settings');
  if (document.activeElement && document.activeElement.id === 'settings-url') return;
  const msgMap = {
    'ok': '<span class="text-finGreen-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgOk') + '</span>',
    'error': '<span class="text-finRed-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgError') + '</span>',
    'syncing': '<span class="text-brand-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgSyncing') + '</span>',
    'no-url': '<span class="text-slate-500 font-medium flex items-center gap-1 mt-3 text-xs">' + t('syncMsgNoUrl') + '</span>'
  };

  el.innerHTML = `
    <div class="space-y-6">
      <div class="glass-card p-6 border-l-4 border-l-brand-900">
        <h2 class="font-bold text-brand-900 text-base mb-1">${t('settingsTitle')}</h2>
        <p class="text-xs text-slate-600 mb-4 font-medium">${t('settingsDesc')}</p>
        <div class="mb-4">
          <input class="input-field w-full text-xs font-mono text-brand-900" id="settings-url" value="${scriptUrl}" />
          ${msgMap[syncStatus] || ''}
          ${lastSync ? `<div class="saved-note">${t('lastSync', fmtTime(lastSync))}</div>` : ''}
        </div>
        <button class="glass-btn-primary font-bold text-xs py-3 px-6 rounded-xl" onclick="saveSettings()">${t('btnSaveSettings')}</button>
      </div>

      ${deferredPrompt ? `<div class="glass-card p-6 border-l-4 border-l-brand-600">
        <h2 class="font-bold text-brand-900 text-base mb-1">${t('installTitle')}</h2>
        <p class="text-xs text-slate-600 mb-4 font-medium">${t('installDesc')}</p>
        <button class="glass-btn-primary font-bold text-xs py-3 px-6 rounded-xl" onclick="installApp()">${t('installBtn')}</button>
      </div>` : ''}

      <div class="glass-card p-6 border-l-4 border-l-luxuryGold-500">
        <h2 class="font-bold text-brand-900 text-base mb-1">${t('languageTitle')}</h2>
        <p class="text-xs text-slate-600 mb-4 font-medium">${t('languageDesc')}</p>
        <div class="flex gap-3">
          <button class="px-5 py-2.5 rounded-xl text-xs font-bold transition ${lang === 'bn' ? 'glass-btn-primary' : 'bg-white/60 text-slate-700 border border-slate-200 hover:bg-white/90'}" onclick="setLanguage('bn')">${t('langBangla')}</button>
          <button class="px-5 py-2.5 rounded-xl text-xs font-bold transition ${lang === 'en' ? 'glass-btn-primary' : 'bg-white/60 text-slate-700 border border-slate-200 hover:bg-white/90'}" onclick="setLanguage('en')">${t('langEnglish')}</button>
        </div>
      </div>
    </div>`;
}

function saveSettings() {
  const val = document.getElementById('settings-url').value.trim();
  scriptUrl = val;
  localStorage.setItem('appsScriptUrl', val);
  fetchFromSheet();
}

function setLanguage(l) {
  lang = l;
  localStorage.setItem('appLang', l);
  renderAll();
}

applyStaticText();
if (scriptUrl) {
  const cached = loadCache();
  if (cached) { data = cached.data; lastSync = cached.t || 0; }
  fetchFromSheet();      // starts syncing right away (status becomes "syncing" synchronously)
  renderAll();           // cached numbers instantly, or loading skeletons when there is no cache yet
  if (data) hideSplashSoon();
} else {
  renderAll();
  hideSplashSoon();
}
updateOnlineBar();
setTimeout(hideSplashSoon, 3000);

window.addEventListener('online', () => { updateOnlineBar(); if (scriptUrl) fetchFromSheet(); });
window.addEventListener('offline', updateOnlineBar);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && scriptUrl && navigator.onLine && Date.now() - lastSync > 60000) fetchFromSheet();
});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
