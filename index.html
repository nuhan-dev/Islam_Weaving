  .cycle-sep { display: none; color: #64748b; font-weight: 700; }

  .pill-live {

  .pill-live.green .ping-dot .ring { background: #a7f3d0; }

  .nav-tab:focus-visible { outline: 2px solid #fbbf24; outline-offset: 2px; }

  /* ===== Pro polish: splash, toast, skeleton, charts, motion ===== */
  @keyframes panel-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .glass-btn-primary, .nav-tab, #syncBtn { transition: transform 0.12s ease, background-color 0.2s ease, box-shadow 0.2s ease; }
  .glass-btn-primary:active, .nav-tab:active, #syncBtn:active { transform: scale(0.96); }

  .btn-loading { pointer-events: none; opacity: 0.85; }

  #toast {

  .offline-bar { background: #fbbf24; color: #1f2937; text-align: center; font-size: 12px; font-weight: 800; padding: 6px 12px; }

const sleep = ms => new Promise(r => setTimeout(r, ms));
const CACHE_KEY = 'iwfCache';
let lastSync = 0;
let inflight = null;
const pendingSaves = new Set();
let deferredPrompt = null;
let firstRevealDone = false;
let splashHidden = false;
const splashStart = Date.now();

function fetchWithTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms || 15000);
  return fetch(url, Object.assign({}, opts || {}, { signal: ctrl.signal })).finally(() => clearTimeout(id));
}

const validData = j => !!(j && Array.isArray(j.weeks) && Array.isArray(j.singeing) && Array.isArray(j.lifetime) && j.assumptions);

function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && c.url === scriptUrl && validData(c.data)) return c;
  } catch (e) {}
  return null;
}

function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ url: scriptUrl, t: lastSync, data })); } catch (e) {}
}

function applyData(json) {
  data = json;
  lastSync = Date.now();
  saveCache();
  renderAll();
  setSyncStatus('ok');
  updateOnlineBar();
  hideSplashSoon();
}

let earlyUsed = false;

// First try; if it fails fast, retry at once. If it is slow (>3.5s) start a second request in parallel and take whichever answers first.
function fetchJsonHedged() {
  return new Promise((resolve, reject) => {
    let finished = false, launched = 0, failed = 0, hedgeTimer = null;
    const finish = (fn, v) => { if (finished) return; finished = true; clearTimeout(hedgeTimer); fn(v); };
    const launch = () => {
      if (finished || launched >= 2) return;
      launched++;
      fetchWithTimeout(scriptUrl, { cache: 'no-store' }, 15000)
        .then(r => r.json())
        .then(j => { if (!validData(j)) throw new Error('bad data'); finish(resolve, j); })
        .catch(e => {
          failed++;
          if (failed >= launched) { if (launched < 2) launch(); else finish(reject, e); }
        });
    };
    launch();
    hedgeTimer = setTimeout(launch, 3500);
  });
}

function fetchFromSheet() {
  if (!scriptUrl) { setSyncStatus('no-url'); return Promise.resolve(false); }
  if (inflight) return inflight;
  if (!navigator.onLine) {
    setSyncStatus('error');
    if (!data) renderAll();
    updateOnlineBar();
    hideSplashSoon();
    return Promise.resolve(false);
  }
  setSyncStatus('syncing');
  inflight = (async () => {
    try {
      let json = null;
      if (!earlyUsed && window.__early && Date.now() - window.__early.t < 20000) {
        earlyUsed = true;
        try {
          json = await Promise.race([window.__early.p, new Promise(res => setTimeout(() => res(null), 3500))]);
          if (!validData(json)) json = null;
        } catch (e) { json = null; }
      }
      if (!json) json = await fetchJsonHedged();
      applyData(json);
      return true;
    } catch (e) {
      setSyncStatus('error');
      if (!data) renderAll();
      updateOnlineBar();
      hideSplashSoon();
      return false;
    }
  })().finally(() => { inflight = null; });
  return inflight;
}

// opts: { key, clearIds, apply }  — apply() updates local data instantly (optimistic); it is rolled back if saving fails
async function pushAction(action, opts) {
  const o = opts || {};
  const key = o.key || 'save';
  const clearIds = o.clearIds || [];
  if (pendingSaves.has(key)) return false;
  if (!scriptUrl) { showToast(t('toastNoUrl'), 'err'); haptic([40, 60, 40]); return false; }
  if (!navigator.onLine) { showToast(t('toastOffline'), 'err'); haptic([40, 60, 40]); return false; }

  const backup = data ? JSON.stringify(data) : null;
  const lockIds = o.lockIds || [];
  const typed = clearIds.concat(lockIds).map(id => { const el = document.getElementById(id); return [id, el ? el.value : '']; });
  lockIds.forEach(id => unlockedFields.delete(id));
  pendingSaves.add(key);
  applyPending();
  setSyncStatus('syncing');

  if (o.apply && data) {
    o.apply();
    clearIds.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    renderAll();
  }

  try {
    const res = await fetchWithTimeout(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(action),
    }, 20000);
    let json = null;
    try { json = await res.json(); } catch (e) {}
    if (json && json.ok === false) throw new Error(json.error || 'save failed');   // the sheet script reported an error
    if (validData(json)) applyData(json); else await fetchFromSheet();
    showToast(t('toastSaved'), 'ok');
    haptic(30);
    return true;
  } catch (e) {
    if (backup) data = JSON.parse(backup);
    lockIds.forEach(id => unlockedFields.add(id));
    setSyncStatus('error');
    renderAll();
    typed.forEach(([id, v]) => { const el = document.getElementById(id); if (el && v !== '') el.value = v; });
    showToast(t('toastFailed'), 'err');
    haptic([40, 60, 40]);
    return false;
  } finally {
    pendingSaves.delete(key);
    applyPending();
  }
}

function applyPending() {
  document.querySelectorAll('[data-save]').forEach(el => el.classList.toggle('btn-loading', pendingSaves.has(el.dataset.save)));
}

let toastTimer;
function showToast(msg, kind) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'show ' + (kind || 'info');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2600);
}

function haptic(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

function fmtTime(ts) {

function updateOnlineBar() {

function hideSplashSoon() {
  if (splashHidden) return;

  const wait = Math.max(0, 450 - (Date.now() - splashStart));
  setTimeout(() => {
    const sp = document.getElementById('splash');
    if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 700); }
    setTimeout(() => runCountUps(true), 150);

}

// ---- count-up numbers ----
const cuMemory = {};
function cu(key, v) {
  const n = Number(v) || 0;
  return `<span class="cu" data-k="${key}" data-v="${n}">${fmtBDT(n)}</span>`;
}
function splashVisible() {
  const sp = document.getElementById('splash');
  return !!sp && !sp.classList.contains('out');
}

const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const cuCur = {};          // last number shown while rolling, per key
let cuTicker = null;

// While syncing, the amounts keep "rolling" (random numbers around the real value)
function tickCu() {
  if (splashVisible()) return;
  document.querySelectorAll('.cu').forEach(el => {
    if (el.closest('.panel.hidden')) return;
    const target = Number(el.dataset.v) || 0;
    if (!target) return;
    const v = Math.round(target * (0.35 + Math.random() * 1.25));
    cuCur[el.dataset.k] = v;
    el.textContent = fmtBDT(v);
  });
}
function startCuTicker() { document.body.classList.add('is-syncing'); }
function stopCuTicker() { document.body.classList.remove('is-syncing'); return false; }

// force = true: count to the real value (from the last rolling number, or from 0)
function runCountUps(force) {
  if (splashVisible() || cuTicker) return;   // splash covers the screen / still rolling
  const reduce = reduceMotion();
  document.querySelectorAll('.cu').forEach(el => {
    const key = el.dataset.k;
    const target = Number(el.dataset.v) || 0;
    const hiddenPanel = !!el.closest('.panel.hidden');
    let from;
    if (force) from = cuCur[key] !== undefined ? cuCur[key] : 0;
    else from = cuMemory[key] === undefined ? 0 : cuMemory[key];
    delete cuCur[key];
    cuMemory[key] = target;
    if (reduce || hiddenPanel || from === target) { el.textContent = fmtBDT(target); return; }
    const start = performance.now();
    const dur = 700;
    el.textContent = fmtBDT(from);
    const step = now => {
      const k = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtBDT(from + (target - from) * e);
      if (k < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = fmtBDT(target);
    };
    requestAnimationFrame(step);
  });
}

// ---- staggered card reveal ----
function staggerIn(panel) {
  if (!panel) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const list = Array.from(panel.querySelectorAll('.space-y-3 > *, .space-y-4 > *, .space-y-6 > *'));
  Array.from(panel.children).forEach(c => { if (c.classList.contains('glass-card') && !list.includes(c)) list.unshift(c); });
  list.forEach((el, i) => {
    el.style.setProperty('--i', Math.min(i, 8));
    el.classList.remove('reveal');
    void el.offsetWidth;
    el.classList.add('reveal');
  });
}

// ---- week-over-week chip + charts ----
function deltaChip(cur, prev) {
  if (prev === undefined || prev === null || prev === '') return '';
  const d = (Number(cur) || 0) - (Number(prev) || 0);
  if (Math.abs(d) < 1) return '';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${fmtBDT(Math.abs(d))}</span>`;
}

function chartHead(title, sub) {
  return `<div class="px-6 py-4 border-b border-slate-200/60 bg-white/40">
    <h2 class="font-bold text-brand-900 text-base tracking-tight">${title}</h2>
    ${sub ? `<p class="text-[11px] text-slate-500 font-semibold mt-0.5">${sub}</p>` : ''}
  </div>`;
}

function weeksChartHTML() {
  const rows = (data.weeks || []).slice(0, 4);
  const vals = rows.map(w => Number(w.combinedProfit) || 0);
  if (!rows.length || !vals.some(v => v !== 0)) return '';
  const W = 320, H = 172, top = 28, bottom = 30, pad = 14;
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0), span = (max - min) || 1;
  const y = v => top + ((max - v) / span) * (H - top - bottom);
  const y0 = y(0);
  const slot = (W - pad * 2) / rows.length;
  const bw = Math.min(22, slot * 0.28);
  let bars = '';
  vals.forEach((v, i) => {
    const x = pad + slot * i + (slot - bw) / 2;
    const yy = Math.min(y(v), y0);

    const pos = v >= 0;
    const labelY = pos ? yy - 7 : yy + hh + 14;
    const cx = (x + bw / 2).toFixed(1);
    bars += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="5" fill="url(#${pos ? 'cgPos' : 'cgNeg'})"></rect>`
      + `<text x="${cx}" y="${labelY.toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="${pos ? '#047857' : '#b91c1c'}">${fmtBDT(v)}</text>`
      + `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">${localDigits(lang === 'bn' ? 'সপ্তাহ ' + (i + 1) : 'Wk ' + (i + 1))}</text>`;
  });
  const deltas = vals.map((v, i) => (i === 0 ? '<span></span>' : (deltaChip(v, vals[i - 1]) || '<span></span>'))).join('');

          <linearGradient id="cgNeg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
        </defs>
        <line x1="${pad}" x2="${W - pad}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="#cbd5e1" stroke-dasharray="3 4"></line>
        ${bars}
      </svg>

// compact numbers for chart axes: 14K / 7.4L
function chartCompact(v) {
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  let txt;
  if (a >= 100000) txt = (Math.round(a / 10000) / 10).toString() + (lang === 'bn' ? ' লা' : 'L');
  else if (a >= 1000) txt = (a >= 10000 ? Math.round(a / 1000) : Math.round(a / 100) / 10).toString() + (lang === 'bn' ? ' হা' : 'K');
  else txt = Math.round(a).toString();
  return sg + localDigits(txt);
}

// smooth curve through points (monotone cubic, no overshoot)
function smoothPath(p) {
  if (p.length < 2) return '';
  const n = p.length, dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1][0] - p[i][0]; m[i] = (p[i + 1][1] - p[i][1]) / (dx[i] || 1); }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  let d = 'M' + p[0][0].toFixed(1) + ' ' + p[0][1].toFixed(1);
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += ' C' + (p[i][0] + h).toFixed(1) + ' ' + (p[i][1] + t[i] * h).toFixed(1) + ' '
      + (p[i + 1][0] - h).toFixed(1) + ' ' + (p[i + 1][1] - t[i + 1] * h).toFixed(1) + ' '
      + p[i + 1][0].toFixed(1) + ' ' + p[i + 1][1].toFixed(1);
  }
  return d;
}

function monthShort() {
  return lang === 'bn'
    ? ['জানু', 'ফেব', 'মার্চ', 'এপ্রি', 'মে', 'জুন', 'জুলা', 'আগ', 'সেপ্টে', 'অক্টো', 'নভে', 'ডিসে']
    : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
}

function monthlyIncomeChartHTML() {
  if (!data || !data.lifetime) return '';
  const nowD = new Date(), curYear = nowD.getFullYear(), nowM = nowD.getMonth();
  const pts = [];
  data.lifetime.forEach(r => {
    if (Number(r.year) !== curYear) return;
    const mi = MONTH_NAMES.indexOf(r.month);
    const v = Number(r.monthlyIncome);
    if (mi < 0 || mi > nowM || r.monthlyIncome === '' || !(v > 0)) return;
    pts.push({ mi, v });
  });
  if (!pts.length) return '';
  const MS = monthShort();
  const W = 340, H = 214, padL = 38, padR = 10, top = 26, bottom = 28;
  const plotW = W - padL - padR, plotH = H - top - bottom;
  const maxV = Math.max(...pts.map(p => p.v));
  const step = (function () { const raw = maxV / 3, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag; })();
  const yMax = Math.ceil(maxV / step) * step;
  const y = v => top + (1 - v / yMax) * plotH;
  const slot = plotW / 12, bw = Math.min(18, slot * 0.62);
  const avg = pts.reduce((a, p) => a + p.v, 0) / pts.length;
  const lastIdx = pts.length - 1;
  let grid = '';
  for (let g = 0; g <= yMax + 0.5; g += step) {
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="#e2e8f0" ${g ? 'stroke-dasharray="3 4"' : ''}></line>`
      + `<text x="${padL - 6}" y="${(y(g) + 3).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="700" fill="#94a3b8">${g ? chartCompact(g) : '0'}</text>`;
  }
  let bars = '';
  pts.forEach((p, i) => {
    const x = padL + slot * p.mi + (slot - bw) / 2, yy = y(p.v), hh = y(0) - yy, r = Math.min(6, bw / 2);
    const isLast = i === lastIdx;
    bars += `<path d="M${x.toFixed(1)} ${y(0).toFixed(1)}V${(yy + r).toFixed(1)}Q${x.toFixed(1)} ${yy.toFixed(1)} ${(x + r).toFixed(1)} ${yy.toFixed(1)}H${(x + bw - r).toFixed(1)}Q${(x + bw).toFixed(1)} ${yy.toFixed(1)} ${(x + bw).toFixed(1)} ${(yy + r).toFixed(1)}V${y(0).toFixed(1)}Z" fill="url(#${isLast ? 'miGold' : 'miGreen'})"></path>`;
    if (hh > 14) {
      bars += `<text x="${(x + bw / 2).toFixed(1)}" y="${(yy - 5).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="800" fill="${isLast ? '#92710f' : '#047857'}">${chartCompact(p.v)}</text>`;
    }
  });
  const labels = MS.map((m, i) => `<text x="${(padL + slot * i + slot / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle" font-size="8" font-weight="700" fill="${pts.some(p => p.mi === i) ? '#475569' : '#cbd5e1'}">${m}</text>`).join('');
  const avgLine = `<line x1="${padL}" x2="${W - padR}" y1="${y(avg).toFixed(1)}" y2="${y(avg).toFixed(1)}" stroke="#b8901f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"></line>`
    + `<text x="${W - padR}" y="${(y(avg) - 4).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="800" fill="#92710f">${t('avgWord')} ${fmtBDT(Math.round(avg))}</text>`;
  const prev = pts.length > 1 ? pts[lastIdx - 1].v : undefined;
  const chip = pts.length > 1 && deltaChip(pts[lastIdx].v, prev)
    ? `<div class="chart-chip">${deltaChip(pts[lastIdx].v, prev)} <span style="font-size:10px;font-weight:700;color:#64748b">${t('vsPrevMonth')}</span></div>` : '';
  return `<div class="glass-card overflow-hidden">
    ${chartHead(t('chartMonthlyTitle', localDigits(curYear)), t('chartMonthlySub'))}
    <div style="padding-top:12px;padding-bottom:6px">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chartMonthlyTitle', curYear)}">
        <defs>
          <linearGradient id="miGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
          <linearGradient id="miGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d675"/><stop offset="1" stop-color="#c9971f"/></linearGradient>
        </defs>
        ${grid}${avgLine}${bars}${labels}
      </svg>
      ${chip}
    </div>
  </div>`;
}

function etaText(months) {
  const y = Math.floor(months / 12), m = months % 12;
  const parts = [];
  if (y) parts.push(localDigits(y) + ' ' + t('unitYear'));
  if (m || !y) parts.push(localDigits(m) + ' ' + t('unitMonth'));
  return parts.join(' ');
}

function lifetimeChartHTML(curYear) {
  const MS = lang === 'bn'
    ? ['জানু', 'ফেব', 'মার্চ', 'এপ্রি', 'মে', 'জুন', 'জুলা', 'আগ', 'সেপ্টে', 'অক্টো', 'নভে', 'ডিসে']
    : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const nowD = new Date();
  const nowKey = nowD.getFullYear() * 12 + nowD.getMonth();
  const keyOf = r => Number(r.year) * 12 + MONTH_NAMES.indexOf(r.month);
  const hasNum = v => v !== '' && v !== null && v !== undefined && !isNaN(Number(v));

  // --- recovery summary (lifetime) ---
  const upto = data.lifetime.filter(r => MONTH_NAMES.indexOf(r.month) >= 0 && keyOf(r) <= nowKey);
  const withData = upto.filter(r => hasNum(r.cumInvestLifetime) && hasNum(r.cumIncomeLifetime) && Number(r.cumInvestLifetime) > 0);
  const lastRow = withData[withData.length - 1];
  let summary = '';
  if (lastRow) {
    const invest = Number(lastRow.cumInvestLifetime);
    const income = Number(lastRow.cumIncomeLifetime);
    const pct = Math.max(0, Math.min(100, (income / invest) * 100));
    const remaining = Math.max(0, invest - income);
    const incomes = upto.map(r => Number(r.monthlyIncome)).filter(v => v > 0);
    const avg = incomes.length ? incomes.reduce((x, y) => x + y, 0) / incomes.length : 0;
    const eta = remaining > 0 && avg > 0 ? Math.ceil(remaining / avg) : null;
    const pctTxt = localDigits(pct.toFixed(1).replace(/\.0$/, ''));
    summary = `<div class="recov">
      <div class="recov-top"><b>${t('recoveredTitle', pctTxt)}</b><span>${t('recoveredOf', fmtBDT(income), fmtBDT(invest))}</span></div>
      <div class="recov-bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="recov-meta">
        ${remaining > 0 ? `<span class="delta down" style="margin-left:0">${t('remainingLabel', fmtBDT(remaining))}</span>` : `<span class="delta up" style="margin-left:0">${t('passedBreakEven', fmtBDT(income - invest))}</span>`}
        ${eta ? `<span class="recov-eta">${t('etaLabel', etaText(eta))}</span>` : ''}
      </div>
    </div>`;
  }

  // --- zoomed trend for this year ---
  const pts = [];
  data.lifetime.forEach(r => {
    if (Number(r.year) !== curYear || !hasNum(r.profitLossYear)) return;
    const mi = MONTH_NAMES.indexOf(r.month);
    if (mi < 0 || keyOf(r) > nowKey) return;
    pts.push({ mi, v: Number(r.profitLossYear) });
  });
  const head = chartHead(t('chartYearTitle', localDigits(curYear)), t('chartYearSub'));
  if (pts.length < 2) return `<div class="glass-card overflow-hidden">${head}${summary}<div class="chart-note">${t('chartNeedMore')}</div></div>`;

  const W = 340, H = 226, padL = 50, padR = 14, top = 30, bottom = 30;
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { lo -= 1; hi += 1; }
  const span = hi - lo;
  const yMin = lo - span * 0.25, yMax = hi + span * 0.35;
  const plotH = H - top - bottom, plotW = W - padL - padR;
  const y = v => top + ((yMax - v) / (yMax - yMin)) * plotH;
  const x = mi => padL + (mi / 11) * plotW;
  const first = pts[0], last = pts[pts.length - 1];
  const improved = last.v >= first.v;
  const color = improved ? '#10b981' : '#ef4444';
  const dark = improved ? '#047857' : '#b91c1c';
  const base = top + plotH;
  const xy = pts.map(p => [x(p.mi), y(p.v)]);
  const line = smoothPath(xy);
  const area = line + ` L${x(last.mi).toFixed(1)} ${base.toFixed(1)} L${x(first.mi).toFixed(1)} ${base.toFixed(1)} Z`;

  // grid + y-axis labels (4 even steps)
  let grid = '';
  for (let g = 0; g <= 3; g++) {
    const v = yMin + ((yMax - yMin) * g) / 3, yy = y(v);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#e2e8f0" stroke-dasharray="${g ? '3 4' : '0'}"></line>`
      + `<text x="${padL - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="700" fill="#94a3b8">${chartCompact(v)}</text>`;
  }
  const labels = monthShort().map((m, i) => `<text x="${x(i).toFixed(1)}" y="${H - 9}" text-anchor="middle" font-size="8" font-weight="700" fill="${pts.some(p => p.mi === i) ? '#475569' : '#cbd5e1'}">${m}</text>`).join('');

  let zero = '';
  if (0 >= yMin && 0 <= yMax) {
    zero = `<line x1="${padL}" x2="${W - padR}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5 4"></line>`
         + `<text x="${W - padR}" y="${(y(0) - 5).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="800" fill="#047857">${t('breakEvenLine')}</text>`;
  } else {
    zero = `<text x="${W - padR}" y="14" text-anchor="end" font-size="9" font-weight="800" fill="#047857">${t('breakEvenTop')}</text>`;
  }

  const dots = pts.map((p, i) => i === pts.length - 1 ? '' : `<circle cx="${x(p.mi).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.8" fill="#fff" stroke="${color}" stroke-width="2"></circle>`).join('');
  const lx = x(last.mi), ly = y(last.v);
  const pillW = Math.max(58, fmtBDT(last.v).length * 6.4 + 14), pillX = Math.min(Math.max(lx - pillW / 2, padL), W - padR - pillW);
  const endMark = `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9" fill="${color}" opacity="0.18"></circle>`
    + `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.6" fill="${color}" stroke="#fff" stroke-width="2"></circle>`
    + `<rect x="${pillX.toFixed(1)}" y="${(ly - 33).toFixed(1)}" width="${pillW.toFixed(1)}" height="19" rx="9.5" fill="${dark}"></rect>`
    + `<text x="${(pillX + pillW / 2).toFixed(1)}" y="${(ly - 20).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff">${fmtBDT(last.v)}</text>`;

  const diff = last.v - first.v;
  const trendChip = Math.abs(diff) >= 1
    ? `<div class="chart-chip"><span class="delta ${diff > 0 ? 'up' : 'down'}" style="margin-left:0">${diff > 0 ? t('improvedLabel', fmtBDT(diff)) : t('worsenedLabel', fmtBDT(Math.abs(diff)))}</span></div>`
    : '';

  return `<div class="glass-card overflow-hidden">
    ${head}
    ${summary}
    <div style="padding-top:8px;padding-bottom:6px">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chartYearTitle', curYear)}">
        <defs><linearGradient id="clArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.30"/><stop offset="1" stop-color="${color}" stop-opacity="0.02"/></linearGradient></defs>
        ${grid}${zero}
        <path d="${area}" fill="url(#clArea)"></path>
        <path d="${line}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
        ${dots}${endMark}${labels}
      </svg>

let reportLang = (function () { try { return localStorage.getItem('reportLang') === 'bn' ? 'bn' : 'en'; } catch (e) { return 'en'; } })();

function setReportLang(l) {
  reportLang = l === 'bn' ? 'bn' : 'en';
  try { localStorage.setItem('reportLang', reportLang); } catch (e) {}
  renderAll();
}

function reportDigits(rl, v) {
  return rl === 'bn' ? String(v).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]) : String(v);
}

function reportRef(groups) {
  const p2 = n => String(n).padStart(2, '0');
  if (!groups) { const d = new Date(); return 'IW-' + d.getFullYear() + '-' + p2(d.getMonth() + 1); }
  const a = groups[0], b = groups[1];
  if (!b) return 'IW-' + a.y + '-' + p2(a.m + 1);
  return 'IW-' + a.y + '-' + p2(a.m + 1) + '/' + (b.y !== a.y ? b.y + '-' : '') + p2(b.m + 1);
}

function buildReportModel(rl) {
  const blankW = i => ({ week: i + 1, date: '', totalPieces: 0, weeklyThaan: 0, totalProfit: 0, myProfit: 0, twoMachineProfit: 0, combinedProfit: 0 });
  const blankS = i => ({ week: i + 1, date: '', singedThaan: 0, pay: 0 });
  const fill = (arr, mk) => { const out = (arr || []).slice(0, 4); while (out.length < 4) out.push(mk(out.length)); return out; };
  const weeks = fill(data.weeks, blankW);
  const singeing = fill(data.singeing, blankS);
  const groups = getCycleInfo();
  const wWord = rl === 'bn' ? 'সপ্তাহ' : 'Week';
  let periods;
  if (groups) {
    const two = groups.length > 1;
    periods = groups.map(g => {
      const mn = rl === 'bn' ? MONTH_NAMES_BN[g.m] : (two ? MONTH_NAMES[g.m].slice(0, 3) : MONTH_NAMES[g.m]).toUpperCase();
      const wl = g.from === g.to ? wWord + ' ' + g.from : wWord + ' ' + g.from + '-' + g.to;
      return { label: mn + ' ' + reportDigits(rl, g.y), weeks: two ? reportDigits(rl, wl) : '' };
    });
  } else {
    const d = new Date();
    periods = [{ label: (rl === 'bn' ? MONTH_NAMES_BN[d.getMonth()] : MONTH_NAMES[d.getMonth()].toUpperCase()) + ' ' + reportDigits(rl, d.getFullYear()), weeks: '' }];
  }
  const dates = weeks.map(w => w.date).filter(Boolean);
  const nd = new Date();
  return {
    lang: rl, ref: reportRef(groups), assumptions: data.assumptions, periods, weeks, singeing,
    range: dates.length ? dates[0] + ' – ' + dates[dates.length - 1] : '',
    generated: nd.getDate() + '.' + (nd.getMonth() + 1) + '.' + String(nd.getFullYear()).slice(2),
  };
}

// SVG page -> JPEG (system fonts handle the Bengali text)
async function renderReportJpeg(svg) {
  const SC = 2, W = 794, H = 1123;
  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res;
    img.onerror = () => rej(new Error('svg'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
  const cv = document.createElement('canvas');
  cv.width = W * SC; cv.height = H * SC;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.93));
  if (!blob) throw new Error('jpeg');
  return { bytes: new Uint8Array(await blob.arrayBuffer()), w: cv.width, h: cv.height };
}

// one A4 page that holds the JPEG — a tiny hand-written PDF, no library needed
function jpegToPdf(jpg, wPx, hPx) {
  const enc = new TextEncoder();
  const parts = [], offs = [];
  let offset = 0;
  const push = b => { parts.push(b); offset += b.length; };
  const str = s => push(enc.encode(s));
  str('%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n');
  offs[1] = offset; str('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2] = offset; str('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  offs[3] = offset; str('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');
  offs[4] = offset;
  str('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + wPx + ' /Height ' + hPx + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n');
  push(jpg);
  str('\nendstream\nendobj\n');
  const content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  offs[5] = offset; str('5 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');
  const xref = offset;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  str(x + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, { type: 'application/pdf' });
}

async function downloadReport(share) {
  if (pendingSaves.has('report')) return;
  if (!data) { showToast(t('reportNoData'), 'err'); return; }
  pendingSaves.add('report');
  applyPending();
  try {
    const jpg = await renderReportJpeg(reportSvg(buildReportModel(reportLang)));
    const blob = jpegToPdf(jpg.bytes, jpg.w, jpg.h);
    const name = reportFileName();
    if (share && typeof File !== 'undefined' && navigator.canShare) {
      const file = new File([blob], name, { type: 'application/pdf' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        haptic(30);
        return;
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    showToast(t('reportSaved'), 'ok');
    haptic(30);
  } catch (e) {
    if (!(e && e.name === 'AbortError')) showToast(t('reportFail'), 'err');
  } finally {
    pendingSaves.delete('report');
    applyPending();
  }
}

const unlockedFields = new Set();
const PEN_SVG = '<svg class="ico-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const CLOSE_SVG = '<svg class="ico-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';

// An amount box: empty and editable until a value is saved; after that it is locked until the pen is tapped
function lockBox(id, saved, cls, placeholder, extra, kind) {
  const isText = kind === 'text';
  const has = isText
    ? (saved !== null && saved !== undefined && String(saved).trim() !== '')
    : (saved !== '' && saved !== null && saved !== undefined && Number(saved) !== 0 && !isNaN(Number(saved)));
  const editing = has && unlockedFields.has(id);
  const locked = has && !editing;
  return `<div class="lock-wrap${extra ? ' ' + extra : ''}${editing ? ' is-editing' : ''}">
    <input class="${cls}${locked ? ' is-locked' : ''}" id="${id}" type="${isText ? 'text' : 'number'}"${isText ? '' : ' inputmode="numeric"'} value="${has ? saved : ''}"${locked ? ' readonly' : ''} />
    ${has ? `<button type="button" class="pen-btn" onclick="togglePen('${id}')" aria-label="${t('editLabel')}">${PEN_SVG}${CLOSE_SVG}</button>` : ''}
  </div>`;
}

function togglePen(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const wrap = el.closest('.lock-wrap');
  if (unlockedFields.has(id)) {            // second tap (X) = cancel, go back to the saved value
    unlockedFields.delete(id);
    el.value = el.defaultValue;
    el.readOnly = true;
    el.classList.add('is-locked');
    wrap.classList.remove('is-editing');
  } else {
    unlockedFields.add(id);
    el.readOnly = false;
    el.classList.remove('is-locked');
    wrap.classList.add('is-editing');
    el.focus();
    try { el.select(); } catch (e) {}
  }
}

// ---- 4-week cycle label (derived from the week dates in the sheet) ----
function parseSheetDate(v) {
  if (!v) return null;
  const str = String(v).trim();
  let m = str.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2}|\d{4})$/);
  if (m) {
    let y = Number(m[3]); if (y < 100) y += 2000;
    const d = Number(m[1]), mo = Number(m[2]) - 1;
    if (d < 1 || d > 31 || mo < 0 || mo > 11) return null;
    return { d, m: mo, y };
  }
  const dt = new Date(str);
  if (!isNaN(dt)) return { d: dt.getDate(), m: dt.getMonth(), y: dt.getFullYear() };
  return null;
}

// Returns [{m, y, from, to}] — one entry if all weeks fall in one month, two if the cycle spans two months.
// from/to = week-of-month numbers (1-7 = Week 1, 8-14 = Week 2, ...), same rule as the sheet header.
function getCycleInfo() {
  const rows = (data && Array.isArray(data.weeks)) ? data.weeks.slice(0, 4) : [];
  const dates = rows.map(w => parseSheetDate(w && w.date)).filter(Boolean);
  if (!dates.length) return null;
  const key = x => x.y * 12 + x.m;
  const wk = x => Math.ceil(x.d / 7);
  const k0 = key(dates[0]);
  const first = dates.filter(x => key(x) === k0);
  const rest = dates.filter(x => key(x) !== k0);
  const mk = arr => ({ m: arr[0].m, y: arr[0].y, from: wk(arr[0]), to: wk(arr[arr.length - 1]) });
  return rest.length ? [mk(first), mk(rest)] : [mk(first)];
}

function localDigits(v) {
  return lang === 'bn' ? String(v).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]) : String(v);
}

function cycleMonthLabel(g) {
  return (lang === 'bn' ? MONTH_NAMES_BN : MONTH_NAMES)[g.m] + ' ' + localDigits(g.y);
}

function cycleWeekLabel(g) {
  const w = lang === 'bn' ? 'সপ্তাহ' : 'Week';
  return localDigits(g.from === g.to ? w + ' ' + g.from : w + ' ' + g.from + '-' + g.to);
}

// Short month name(s) for labels, e.g. "September" or "August–September"
function getCycleShortName() {
  const groups = getCycleInfo();
  if (!groups) return getCurrentMonthName();
  const names = lang === 'bn' ? MONTH_NAMES_BN : MONTH_NAMES;
  return groups.map(g => names[g.m]).join('–');
}

// Month cards: one card for a single month; two cards (each with its own week range) when the cycle spans two months
function cycleHeadingHTML() {
  const groups = getCycleInfo();
  if (!groups) return `<div class="cycle-row single"><div class="cycle-chip"><span class="cycle-month">${getCurrentMonthName()}</span></div></div>`;
  const chips = groups.map(g => `<div class="cycle-chip"><span class="cycle-month">${cycleMonthLabel(g)}</span>${groups.length > 1 ? `<span class="pill-live pill-sm">${pingDot()}${cycleWeekLabel(g)}</span>` : ''}</div>`);
  return `<div class="cycle-row${groups.length === 1 ? ' single' : ''}">${chips.join('<span class="cycle-sep">–</span>')}</div>`;
}

}

async function saveCurrentLifetime(i) {
  const row = data.lifetime[i];
  const invVal = document.getElementById('life-cur-inv').value.trim();
  const incVal = document.getElementById('life-cur-inc').value.trim();
  // A box left empty keeps the amount already saved in the sheet (so it never gets overwritten with 0)
  const investment = invVal !== '' ? (Number(invVal) || 0) : (Number(row.investment) || 0);
  const monthlyIncome = incVal !== '' ? (Number(incVal) || 0) : (Number(row.monthlyIncome) || 0);
  const year = row.year;
  const month = row.month;
  await pushAction({ action: 'updateLifetimeMonth', year, month, investment, monthlyIncome }, {
    key: 'life',
    lockIds: ['life-cur-inv', 'life-cur-inc'],
    apply: () => { row.investment = investment; row.monthlyIncome = monthlyIncome; },
  });
}

function renderSettings() {
  const el = document.getElementById('panel-settings');
  if (document.activeElement && document.activeElement.id === 'settings-url') return;
  const msgMap = {
    'ok': '<span class="text-finGreen-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgOk') + '</span>',
    'error': '<span class="text-finRed-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgError') + '</span>',
    'syncing': '<span class="text-brand-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgSyncing') + '</span>',
    'no-url': '<span class="text-slate-500 font-medium flex items-center gap-1 mt-3 text-xs">' + t('syncMsgNoUrl') + '</span>'
  };

  el.innerHTML = `
    <div class="space-y-6">
      <div class="glass-card p-6 border-l-4 border-l-brand-900">
        <h2 class="font-bold text-brand-900 text-base mb-1">${t('settingsTitle')}</h2>
        <p class="text-xs text-slate-600 mb-4 font-medium">${t('settingsDesc')}</p>
        <div class="mb-4">
          <input class="input-field w-full text-xs font-mono text-brand-900" id="settings-url" value="${scriptUrl}" />
          ${msgMap[syncStatus] || ''}
          ${lastSync ? `<div class="saved-note">${t('lastSync', fmtTime(lastSync))}</div>` : ''}
        </div>
        <button class="glass-btn-primary font-bold text-xs py-3 px-6 rounded-xl" onclick="saveSettings()">${t('btnSaveSettings')}</button>
      </div>

      ${deferredPrompt ? `<div class="glass-card p-6 border-l-4 border-l-brand-600">
        <h2 class="font-bold text-brand-900 text-base mb-1">${t('installTitle')}</h2>
        <p class="text-xs text-slate-600 mb-4 font-medium">${t('installDesc')}</p>
        <button class="glass-btn-primary font-bold text-xs py-3 px-6 rounded-xl" onclick="installApp()">${t('installBtn')}</button>
      </div>` : ''}

      <div class="glass-card p-6 border-l-4 border-l-luxuryGold-500">
        <h2 class="font-bold text-brand-900 text-base mb-1">${t('languageTitle')}</h2>
        <p class="text-xs text-slate-600 mb-4 font-medium">${t('languageDesc')}</p>
        <div class="flex gap-3">
          <button class="px-5 py-2.5 rounded-xl text-xs font-bold transition ${lang === 'bn' ? 'glass-btn-primary' : 'bg-white/60 text-slate-700 border border-slate-200 hover:bg-white/90'}" onclick="setLanguage('bn')">${t('langBangla')}</button>
          <button class="px-5 py-2.5 rounded-xl text-xs font-bold transition ${lang === 'en' ? 'glass-btn-primary' : 'bg-white/60 text-slate-700 border border-slate-200 hover:bg-white/90'}" onclick="setLanguage('en')">${t('langEnglish')}</button>
        </div>
      </div>
    </div>`;
}

function saveSettings() {
  const val = document.getElementById('settings-url').value.trim();
  scriptUrl = val;
  localStorage.setItem('appsScriptUrl', val);
  fetchFromSheet();
}

function setLanguage(l) {
  lang = l;
  localStorage.setItem('appLang', l);
  renderAll();
}

applyStaticText();
if (scriptUrl) {
  const cached = loadCache();
  if (cached) { data = cached.data; lastSync = cached.t || 0; }
  fetchFromSheet();      // starts syncing right away (status becomes "syncing" synchronously)
  renderAll();           // cached numbers instantly, or loading skeletons when there is no cache yet
  if (data) hideSplashSoon();
} else {
  renderAll();
  hideSplashSoon();
}
updateOnlineBar();
setTimeout(hideSplashSoon, 3000);

window.addEventListener('online', () => { updateOnlineBar(); if (scriptUrl) fetchFromSheet(); });
window.addEventListener('offline', updateOnlineBar);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && scriptUrl && navigator.onLine && Date.now() - lastSync > 60000) fetchFromSheet();
});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

// Material-style touch ripple
document.addEventListener('pointerdown', function (e) {
  var b = e.target.closest && e.target.closest('.glass-btn-primary,.nav-tab,.rep-chip,.rep-share,#syncBtn');
  if (!b) return;
  var r = b.getBoundingClientRect(), sz = Math.max(r.width, r.height) * 1.3, sp = document.createElement('span');
  sp.className = 'ripple';
  sp.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (e.clientX - r.left - sz / 2) + 'px;top:' + (e.clientY - r.top - sz / 2) + 'px';
  b.appendChild(sp);
  setTimeout(function () { sp.remove(); }, 650);
}, { passive: true });
</script>
