name: Make keystore (run only ONCE)

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop if a keystore already exists
        run: |
          if [ -f islamweaving.jks ]; then
            echo "islamweaving.jks already exists"
            exit 1
          fi

      - name: Check password secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ ${#KEYSTORE_PASSWORD} -lt 8 ]; then
            echo "KEYSTORE_PASSWORD secret missing or shorter than 8 characters"
            exit 1
          fi

      - name: Create keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -keystore islamweaving.jks -alias islamweaving \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Islam Weaving, O=Nuhanat Venture, C=BD"

      - uses: actions/upload-artifact@v4
        with:
          name: islamweaving-keystore
          path: islamweaving.jks
          retention-days: 1
